# Disparo event-driven do Web Push DSB após o site no ar.
# Produção (fan-out) só com vars.EVENTO_PUSH == 'on'.
# Teste isolado: workflow_dispatch com inputs somente + slug (1 destinatário).
# Nunca ecoar ADMIN_TOKEN nem PUSH_AGENDA_URL.
# Runners GitHub levam 403 ao ler dsb.duarte.top; o Worker confirma no_ar no edge.
name: push-evento

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      somente:
        description: 'Chave KV sub:<64 hex> do destinatário do teste isolado'
        required: false
        type: string
      slug:
        description: 'Slug AAAA-MM-DD-… já no ar para o teste isolado'
        required: false
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: push-evento-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Gate e máscaras
        id: gate
        env:
          EVENTO_PUSH: ${{ vars.EVENTO_PUSH }}
          INPUT_SOMENTE: ${{ inputs.somente }}
          INPUT_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.ADMIN_TOKEN }}" ]; then
            echo "::add-mask::${{ secrets.ADMIN_TOKEN }}"
          fi
          if [ -n "${{ secrets.PUSH_AGENDA_URL }}" ]; then
            echo "::add-mask::${{ secrets.PUSH_AGENDA_URL }}"
          fi
          MODO=skip
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_SOMENTE}" ] && [ -n "${INPUT_SLUG}" ]; then
            MODO=isolado
          elif [ "${EVENTO_PUSH:-}" = "on" ]; then
            MODO=evento
          fi
          echo "modo=${MODO}" >> "$GITHUB_OUTPUT"
          if [ "${MODO}" = "skip" ]; then
            echo "EVENTO_PUSH off e sem teste isolado — nada a fazer."
            exit 0
          fi

      - name: Esperar Workers Builds
        if: steps.gate.outputs.modo == 'evento'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DEADLINE=$((SECONDS + 900))
          echo "Aguardando check Workers Builds: datasecuritybriefing em ${SHA}"
          while (( SECONDS < DEADLINE )); do
            STATE=$(gh api "repos/${REPO}/commits/${SHA}/check-runs" \
              --jq '.check_runs[] | select(.name=="Workers Builds: datasecuritybriefing") | {status,conclusion}' \
              | head -n 1 || true)
            echo "check: ${STATE:-nenhum}"
            if echo "${STATE}" | grep -q '"conclusion":"success"'; then
              echo "Builds ok; Worker abrirá janela de 20 min no tick."
              exit 0
            fi
            if echo "${STATE}" | grep -qE '"conclusion":"(failure|cancelled|timed_out)"'; then
              echo "Workers Builds falhou"; exit 1
            fi
            sleep 15
          done
          echo "Timeout aguardando Workers Builds"; exit 1

      - name: POST /admin/tick (evento)
        if: steps.gate.outputs.modo == 'evento' || steps.gate.outputs.modo == 'isolado'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          PUSH_AGENDA_URL: ${{ secrets.PUSH_AGENDA_URL }}
          MODO: ${{ steps.gate.outputs.modo }}
          INPUT_SOMENTE: ${{ inputs.somente }}
          INPUT_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          echo "::add-mask::${ADMIN_TOKEN}"
          echo "::add-mask::${PUSH_AGENDA_URL}"
          if [ -z "${ADMIN_TOKEN}" ] || [ -z "${PUSH_AGENDA_URL}" ]; then
            echo "Secrets ADMIN_TOKEN / PUSH_AGENDA_URL ausentes"; exit 1
          fi
          BASE="${PUSH_AGENDA_URL%/}"
          if [ "${MODO}" = "isolado" ]; then
            echo "${INPUT_SOMENTE}" | grep -Eq '^sub:[0-9a-f]{64}$'
            echo "${INPUT_SLUG}" | grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$'
            BODY=$(python3 -c "import json,os; print(json.dumps({'origem':'evento','somente':[os.environ['INPUT_SOMENTE']],'slug':os.environ['INPUT_SLUG']}))")
            echo "teste isolado: POST direto (Worker valida slug/no_ar/dedupe)"
          else
            BODY='{"origem":"evento"}'
          fi
          RESP=$(curl -sS -w '\nHTTP:%{http_code}' --max-time 60 \
            -X POST "${BASE}/admin/tick" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H 'content-type: application/json' \
            -d "${BODY}")
          echo "${RESP}" | python3 -c "import sys,re; t=sys.stdin.read(); print(re.sub(r'sub:[0-9a-f]{64}', lambda m: 'sub:'+m.group(0)[4:12]+'…'+m.group(0)[-8:], t))"
          CODE=$(echo "${RESP}" | sed -n 's/^HTTP://p' | tail -n1)
          [ "${CODE}" = "200" ] || exit 1
