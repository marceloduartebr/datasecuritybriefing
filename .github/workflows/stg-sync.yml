# STG refresh: nightly full copy of production (D1 dsb-prod) into dsb-staging, D1 to D1 (X-24).
# Notion is frozen since the cutover (2026-11-18), so STG mirrors production instead of reading Notion.
# - The copy script comes from the dsb-api branch (workers/dsb-api/load/copy_prod.py). It only reads dsb-prod
#   (SELECT, refused otherwise) and refuses to write to it; dsb-staging keeps its schema, views and health checks.
# - Same ids as production (#160 is #160 on both). Everything created on STG during the day is replaced each night.
# - Secret: STG_D1_TOKEN (Cloudflare token with D1 read on dsb-prod and D1 edit on dsb-staging; the production
#   load already used it on dsb-prod).
# - Manual run: Actions → this workflow → Run workflow; dry_run reads and counts without writing.
name: STG refresh (dsb-prod → dsb-staging)

on:
  schedule:
    - cron: '23 2 * * *' # 23:23 BRT, after the evening publishing rounds
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read and count only, write nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stg-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Copy script (dsb-api branch)
        uses: actions/checkout@v4
        with:
          ref: dsb-api
          path: loader
          sparse-checkout: workers/dsb-api/load

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Copy dsb-prod into dsb-staging
        env:
          CF_D1: ${{ secrets.STG_D1_TOKEN }}
          JOB_NAME: prod-stg-refresh
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 -I loader/workers/dsb-api/load/copy_prod.py
