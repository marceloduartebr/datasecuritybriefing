# Guarda de capa sem rede: todo briefing PT/ES/EN precisa de cover em covers.duarte.top/covers.
# Não participa do Workers Builds: um erro aqui deixa o check vermelho, mas não bloqueia o deploy.
name: capas

on:
  push:
    branches: [main]
    paths: ['src/content/**', 'scripts/checar-capas.mjs']
  pull_request:
    paths: ['src/content/**', 'scripts/checar-capas.mjs']

permissions:
  contents: read

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/checar-capas.mjs
